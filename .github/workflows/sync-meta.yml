# 同步空 Release 正文——push 到 main 自动执行
# 注：仓库描述/Topics 属于 administration 权限，GITHUB_TOKEN 无权修改，
#     需手动（网页编辑）或 fine-grained PAT（Administration: write）。
name: sync-meta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fill empty release notes
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import json
          import os
          import urllib.request
          import urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = "https://api.github.com"

          def req(method, url, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header("Authorization", f"Bearer {token}")
              r.add_header("Accept", "application/vnd.github+json")
              r.add_header("User-Agent", "sync-meta")
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return resp.status, json.loads(resp.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")

          BODY = ("## 更新内容\n"
                  "- 七平台一体：抖音 / 小红书 / 快手 / B站 / YouTube / X (Twitter) / Instagram 无水印下载\n"
                  "- 抖音：detail 接口改浏览器现场签名，程序自动调用本机 Chrome/Edge 兜底；视频按码率取最高画质\n"
                  "- YouTube：单条 / Shorts / Live / 播放列表（默认只下当前视频，--playlist 下整列表，默认最多 20 条）\n"
                  "- 小红书：图文原图 + 实况动图 + 视频\n"
                  "- X：单条推文下载（yt-dlp；主页批量暂不支持）\n"
                  "- Instagram：单条帖子 / Reels（图集图片+视频全提取）；用户主页批量暂不可用（IG 限流）\n"
                  "- 代理自动检测：启动时读取系统代理（Clash / V2rayN 等），IG / X 免手动填端口\n"
                  "- GUI：下载历史持久化、保存目录选择、链接自动分流、剪贴板识别\n"
                  "- GitHub Actions 自动打包，push v* 标签即出 Release\n\n"
                  "## 使用\n"
                  "安装 Cookie 导出扩展 → 导出各平台 Cookie 放 exe 旁 → 双击运行。详见 README。")

          code, rels = req("GET", f"{api}/repos/{repo}/releases?per_page=10")
          for rel in rels if isinstance(rels, list) else []:
              if not (rel.get("body") or "").strip():
                  c3, _ = req("PATCH", f"{api}/repos/{repo}/releases/{rel['id']}",
                              {"body": BODY})
                  print(f"PATCH release {rel['tag_name']} -> {c3}")
              else:
                  print(f"release {rel['tag_name']} 已有正文，跳过")
