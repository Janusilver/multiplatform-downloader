# 自动打包 release：push v* 标签或手动触发
name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp curl_cffi pyinstaller imageio-ffmpeg

      - name: Prepare portable ffmpeg
        shell: python
        run: |
          import shutil
          import imageio_ffmpeg
          from pathlib import Path
          Path("ffmpeg").mkdir(exist_ok=True)
          shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), "ffmpeg/ffmpeg.exe")

      - name: Build exe（走 build.py：含 Windows 版本资源 FileVersion/ProductName）
        run: |
          python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 多平台下载器-windows
          path: dist/多平台下载器.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub 上传资产对非 ASCII 文件名会退回 default.exe（中文名存不住），
          # 重命名为 ASCII 名再上传，资产名固定为 multiplatform-downloader.exe。
          mv dist/*.exe dist/multiplatform-downloader.exe
          gh release create "${{ github.ref_name }}" dist/multiplatform-downloader.exe \
            --generate-notes --repo "${{ github.repository }}" \
          || gh release upload "${{ github.ref_name }}" dist/multiplatform-downloader.exe \
            --clobber --repo "${{ github.repository }}"
